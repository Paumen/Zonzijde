<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>F1 &mdash; B &middot; een richel die ze scheidt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#d8ccb0;
  font:9px/1.25 Georgia,serif;-webkit-user-select:none;user-select:none}
#f{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,#efe6d4,#e6dcc6 45%,#d8ccb0)}
.c{position:absolute;left:0;top:0;width:78px;min-height:26px;padding:3px 4px;
  background:#fffdf6;border:1px solid #d9cdb4;box-shadow:1px 2px 4px rgba(40,25,10,.20);
  transform-origin:50% 50%;overflow:hidden;color:#2a251f;font-size:6.5px;line-height:1.15}
.c b{display:block;font-size:5px;letter-spacing:.05em;text-transform:uppercase;color:#a2937a}
.c .in{opacity:0;transition:opacity .5s linear}
.c .in.on{opacity:1}
#hud{position:fixed;left:9px;bottom:9px;font:700 9px/1.5 monospace;color:#7a7060;opacity:.8}
#hud i{font-style:normal;color:#a83a2a}
button{position:fixed;right:9px;bottom:9px;font:700 9px monospace;padding:2px 6px;
  background:rgba(247,240,220,.8);border:1px solid #7a7060;color:#4a4334}

#ledge{position:fixed;left:0;right:0;z-index:300;height:0;
  border-top:2px solid rgba(74,64,44,.55);
  box-shadow:0 3px 7px rgba(40,25,10,.13)}
#ledge span{position:absolute;right:9px;top:3px;font:italic 8px Georgia,serif;color:#6b6152}

</style></head><body>
<div id="f"></div><div id="hud"></div><button onclick="location.reload()">opnieuw</button>
<script>
const T=[["Gem Wijchen", "Column: Samen in beweging", "22 jul"], ["nieuws.nl", "Theatervoorstelling 'De Honingbij' in Hernen", "25 jul"], ["nieuws.nl", "Bijna 2000 verkeersboetes in Wijchen", "24 jul"], ["nieuws.nl", "Vrachtwagens kijken bij Truckshow Wijchen", "23 jul"], ["nieuws.nl", "Brons en dubbel gevoel voor Laura Smulders", "22 jul"], ["nieuws.nl", "Wijchen vandaag moeilijk bereikbaar", "22 jul"], ["nieuws.nl", "Dag van Wijchen begint vroeg", "21 jul"], ["nieuws.nl", "Willie Heij op weg voor zijn 66e Vierdaagse", "21 jul"], ["nieuws.nl", "Wout Loeffen loopt voor team Huntington", "21 jul"], ["nieuws.nl", "Toezichthouders kunnen over een grens gaan", "20 jul"], ["nieuws.nl", "Op zoek naar de verdwenen ijscoupes", "20 jul"], ["Gld", "AFTERMOVIE | Dit was de Nijmeegse Vierdaagse", "25 jul"], ["Gld", "Woningbrand in Doetinchem • overval bij fotozaak", "25 jul"], ["Gld", "Aanzienlijke brand bij woning in Doetinchem", "25 jul"], ["Gld", "Verdachte aangehouden na overval op fotozaak", "25 jul"], ["Gld", "EOD waarschuwt voor granaten door lage waterstand", "25 jul"], ["Gld", "Veel schade na kop-staartbotsing op A1", "25 jul"], ["Gld", "Man op snorfiets geschept door auto", "25 jul"], ["Gld", "Papierfabriek Folding Boxboard lijkt gered", "25 jul"], ["Gld", "Minderjarige jongen overleden na ongeval met buggy", "25 jul"], ["Gld", "Dit is er dit weekend te doen in Gelderland", "25 jul"], ["Gld", "Blauwalg en PFAS: hier kun je beter niet zwemmen", "25 jul"], ["Gld", "Kind met spoed naar ziekenhuis na buggy-ongeluk", "24 jul"], ["Gld", "Wesp veroorzaakt ravage op de weg", "24 jul"], ["Gld", "Fietser gewond na botsing met bus", "24 jul"], ["Gld", "Hardleerse bewoner moet 5000 euro betalen", "24 jul"], ["Gld", "NEC op dinsdag 4 augustus tegen Olympiakos Piraeus", "24 jul"], ["Gld", "Droogte legt scheepvaart op het Twentekanaal stil", "24 jul"], ["Gld", "Vuurwerk ontploft op balkon, bewoner gewond", "24 jul"], ["Gld", "Man schiet op agenten en raakt zelf zwaargewond", "24 jul"], ["Gld RvN", "Brandbrief: 'Stop boeren die grondwater oppompen'", "23 jul"], ["Gld RvN", "KIJK: Waal in Vlammen knalt alsnog boven Nijmegen", "22 jul"], ["Gld RvN", "Man overlijdt na schietincident in Nijmegen", "21 jul"], ["Overheid", "Vanaf 1 september vergoeding voor gedupeerden WIA", "24 jul"], ["NOS J", "Kinderen lopen mee in Pridewalk: 'Wees jezelf!'", "25 jul"], ["NOS J", "'Kakkerlakken'-protesten India: minister weg", "25 jul"], ["NOS J", "Nieuwswekker: Vuurbal + World Pride", "25 jul"], ["NOS J", "Speel de Jeugdjournaal Nieuwsquiz!", "25 jul"], ["NOS J", "België krijgt Nederlandse bondscoach", "24 jul"], ["NOS J", "Oeps: Bruidspaar wordt kletsnat tijdens fotoshoot", "24 jul"]];
const N=100, DOOM=60, SURV=40, SPAWN=15, FL=3.6;
const W=innerWidth, H=innerHeight;
const f=document.getElementById('f'), hud=document.getElementById('hud');
let _s=20260726; const rnd=()=>((_s=(_s*1664525+1013904223)&0x7fffffff)/0x7fffffff);
const eo=t=>1-Math.pow(1-t,2.4), ei=t=>Math.pow(t,1.25);

const PX=W*.5-39, PY=H*.80;                       // where the pile sits
const CX=W*.5-39, CY=H*.30;                       // shared control point of the arc
const HEAP=[...Array(SURV)].map((_,k)=>{const t=k/SURV;return{
  x:PX+(rnd()*2-1)*W*.26, y:PY-t*H*.13+(rnd()*2-1)*10, r:(rnd()*2-1)*22};});

const fates=[...Array(DOOM).fill(0),...Array(SURV).fill(1)];
for(let i=fates.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[fates[i],fates[j]]=[fates[j],fates[i]];}
const OLD=[...Array(N)].map(()=>`${8+((rnd()*12)|0)} jul`);

let entered=0, landed=0, gone=0;
const cards=fates.map((fate,i)=>{
  const el=document.createElement('div'); el.className='c'; el.style.opacity=0;
  f.appendChild(el);
  const sx=6+rnd()*(W-90);
  return {el,fate,i,sx,r0:(rnd()-.5)*20,
          gx:W*.06+rnd()*W*.30,                   // exits low, off toward the near side
          t0:.25+i*(SPAWN/N)+rnd()*.10,
          u:0,shown:false,slot:-1,dead:false};
});

function bez(p0,c,p1,t){const m=1-t;return m*m*p0+2*m*t*c+t*t*p1;}

function reveal(c){
  c.shown=true;
  if(c.fate){
    c.slot=landed++; const t=T[c.slot%T.length];
    c.el.style.zIndex=400+c.slot;
    c.el.innerHTML=`<span class="in"><b>${t[0]}</b>${t[1]}</span>`;
  }else{
    c.el.style.zIndex=5;
    
  }
  requestAnimationFrame(()=>c.el.querySelectorAll('.in').forEach(e=>e.classList.add('on')));
}

function pose(c,u){
  let x,y,r,s=1,o=1;
  if(c.fate){
    const t=eo(u), h=HEAP[c.slot<0?0:c.slot];
    x=bez(c.sx,CX,h.x,t); y=bez(-52,CY,h.y,t);
    r=c.r0+((c.slot<0?0:h.r)-c.r0)*t;
  }else{
    const t=ei(u);
    x=bez(c.sx,CX,c.gx,t); y=bez(-52,CY,H+90,t);
    r=c.r0+34*t;
    o=u>.88?(1-u)/.12:1;
    
  }
  c.el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  c.el.style.opacity=o;
}


const L=document.createElement('div'); L.id='ledge';
L.style.top=(PY+30)+'px';
f.appendChild(L);


let last=performance.now();
function frame(rt){
  const dt=Math.min(.05,(rt-last)/1000); last=rt;
  for(const c of cards){
    if(c.dead) continue;
    if(c.t0>0){ c.t0-=dt; if(c.t0>0) continue; entered++; }
    c.u=Math.min(1,c.u+dt/FL);
    if(!c.shown&&c.u>=.30) reveal(c);
    pose(c,c.u);
    if(c.fate&&c.u>=1) c.el.style.zIndex=10+c.slot;
    if(!c.fate&&c.u>=1){ c.dead=true; c.el.remove(); gone++; }
  }
  hud.innerHTML=`B &middot; een richel die ze scheidt<br>binnen ${entered} &middot; ligt er ${landed} &middot; <i>weg ${gone}</i>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{last=t;frame(t)});
</script></body></html>
