<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>F1 lo-fi &mdash; A wijkt terug (diepte = verleden)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#d8ccb0;
  font:9px/1.25 Georgia,serif;-webkit-user-select:none;user-select:none}
#f{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,#efe6d4,#e6dcc6 45%,#d8ccb0)}
.c{position:absolute;left:0;top:0;width:76px;height:24px;padding:3px 4px;
  background:#fffdf6;border:1px solid #d9cdb4;box-shadow:1px 2px 3px rgba(40,25,10,.16);
  transform-origin:50% 50%;overflow:hidden;color:#2a251f;font-size:6.5px;line-height:1.15}
.c b{display:block;font-size:5px;letter-spacing:.05em;text-transform:uppercase;color:#a2937a}
#hud{position:fixed;left:8px;top:8px;font:700 10px/1.5 monospace;color:#5a5142}
#hud i{font-style:normal;color:#a83a2a}
#zone{position:absolute;border:1px dashed rgba(90,80,60,.35)}
button{position:fixed;right:8px;top:8px;font:700 9px monospace;padding:2px 6px;
  background:#f7f0dc;border:1px solid #4a4334}
</style></head><body>
<div id="f"><div id="zone"></div></div>
<div id="hud"></div><button onclick="location.reload()">opnieuw</button>
<script>
const TITLES=[["Gem Wijchen", "Column: Samen in beweging"], ["nieuws.nl", "Theatervoorstelling 'De Honingbij' in Hernen"], ["nieuws.nl", "Bijna 2000 verkeersboetes in Wijchen"], ["nieuws.nl", "Vrachtwagens kijken bij Truckshow Wijchen"], ["nieuws.nl", "Brons en dubbel gevoel voor Laura Smulders"], ["nieuws.nl", "Wijchen vandaag moeilijk bereikbaar"], ["nieuws.nl", "Dag van Wijchen begint vroeg"], ["nieuws.nl", "Willie Heij op weg voor zijn 66e Vierdaagse"], ["nieuws.nl", "Wout Loeffen loopt voor team Huntington"], ["nieuws.nl", "Toezichthouders kunnen over een grens gaan"], ["nieuws.nl", "Op zoek naar de verdwenen ijscoupes"], ["Gld", "AFTERMOVIE | Dit was de Nijmeegse Vierdaagse"], ["Gld", "Woningbrand in Doetinchem • overval bij fotozaak"], ["Gld", "Aanzienlijke brand bij woning in Doetinchem"], ["Gld", "Verdachte aangehouden na overval op fotozaak"], ["Gld", "EOD waarschuwt voor granaten door lage waterstand"], ["Gld", "Veel schade na kop-staartbotsing op A1"], ["Gld", "Motorrijder naar ziekenhuis na ongeluk op kruispunt"], ["Gld", "Man op snorfiets geschept door auto"], ["Gld", "Papierfabriek Folding Boxboard lijkt gered"], ["Gld", "Minderjarige jongen overleden na ongeval met buggy"], ["Gld", "Zware aanrijding in woonwijk, rijbewijs ingevorderd"], ["Gld", "Avondje vissen krijgt plots een gevaarlijke wending"], ["Gld", "Dit is er dit weekend te doen in Gelderland"], ["Gld", "Blauwalg en PFAS: hier kun je beter niet zwemmen"], ["Gld", "Kind met spoed naar ziekenhuis na buggy-ongeluk"], ["Gld", "Wesp veroorzaakt ravage op de weg"], ["Gld", "Fietser gewond na botsing met bus"], ["Gld", "Hardleerse bewoner moet 5000 euro betalen"], ["Gld", "NEC op dinsdag 4 augustus tegen Olympiakos Piraeus"], ["Gld", "Droogte legt scheepvaart op het Twentekanaal stil"], ["Gld", "Vuurwerk ontploft op balkon, bewoner gewond"], ["Gld", "Man schiet op agenten en raakt zelf zwaargewond"], ["Gld RvN", "Brandbrief: 'Stop boeren die grondwater oppompen'"], ["Gld RvN", "KIJK: Waal in Vlammen knalt alsnog boven Nijmegen"], ["Gld RvN", "Man overlijdt na schietincident in Nijmegen"], ["Overheid", "Vanaf 1 september vergoeding voor gedupeerden WIA"], ["NOS J", "Kinderen lopen mee in Pridewalk: 'Wees jezelf!'"], ["NOS J", "'Kakkerlakken'-protesten India: minister weg"], ["NOS J", "Nieuwswekker: Vuurbal + World Pride"]];
const N=100, DOOM=60, SURV=40, SPAWN=16, FL=3.4, FORK=.40;
const W=innerWidth, H=innerHeight;
const PILE={x:(W-4*80)/2,y:H*.56,cols:4,rowh:26,colw:80};                       // {x,y,cols,rowh,colw}
const f=document.getElementById('f'), hud=document.getElementById('hud');
const z=document.getElementById('zone');
z.style.cssText=`left:${PILE.x-4}px;top:${PILE.y-4}px;`+
  `width:${PILE.cols*PILE.colw+8}px;height:${(SURV/PILE.cols)*PILE.rowh+8}px`;

let _s=20260726; const rnd=()=>((_s=(_s*1664525+1013904223)&0x7fffffff)/0x7fffffff);
const fates=[...Array(DOOM).fill(0),...Array(SURV).fill(1)];
for(let i=fates.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[fates[i],fates[j]]=[fates[j],fates[i]];}

const eo=t=>1-Math.pow(1-t,3), lin=t=>t;
let landed=0, entered=0, gone=0;
const cards=fates.map((fate,i)=>{
  const el=document.createElement('div'); el.className='c'; f.appendChild(el);
  const sx=20+rnd()*(W-116);
  return {el,fate,i,sx,fx:sx+(rnd()-.5)*60,fy:H*.40+(rnd()-.5)*40,
          t0:.4+i*(SPAWN/N)+rnd()*.12,forked:false,slot:-1,u:0,dead:false};
});

function pose(c,u){
  let x,y,s=1,o=1,r=0;
  if(u<FORK){                                   // identical inbound leg
    const v=u/FORK;
    x=c.sx+(c.fx-c.sx)*v; y=-40+(c.fy+40)*v;
  }else{
    const v=(u-FORK)/(1-FORK);
    if(c.fate){                                 // survivor -> pile
      const e=eo(Math.min(1,v/.8));
      const col=c.slot%PILE.cols, row=(c.slot/PILE.cols)|0;
      const px=PILE.x+col*PILE.colw, py=PILE.y+row*PILE.rowh;
      x=c.fx+(px-c.fx)*e; y=c.fy+(py-c.fy)*e;
      s=1+.14*e;
    }else{                                      // doomed
      const e=v;const vx=W*.5,vy=H*.14;x=c.fx+(vx-c.fx)*e; y=c.fy+(vy-c.fy)*e;s=1-.86*e; o=1-e*e; r=(c.i%2?8:-8)*e;
    }
  }
  c.el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  c.el.style.opacity=o;
}

let last=performance.now();
function frame(rt){
  const dt=Math.min(.05,(rt-last)/1000); last=rt;
  for(const c of cards){
    if(c.dead) continue;
    if(c.t0>0){ c.t0-=dt; if(c.t0>0) continue; entered++; }
    c.u=Math.min(1,c.u+dt/FL);
    if(!c.forked&&c.u>=FORK){                   // the fork: identity appears here
      c.forked=true;
      if(c.fate){ c.slot=landed++;
        const t=TITLES[c.slot%TITLES.length];
        c.el.innerHTML=`<b>${t[0]}</b>${t[1]}`; }
    }
    pose(c,c.u);
    if(!c.fate&&c.u>=1){ c.dead=true; c.el.remove(); gone++; }
  }
  hud.innerHTML=`A wijkt terug (diepte = verleden)<br>binnen ${entered}<br>blijft ${landed}<br><i>weg ${gone}</i>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{last=t;frame(t)});
</script></body></html>
